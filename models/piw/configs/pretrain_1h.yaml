# Pretraining Configuration - 1 hour subset
# For Data Efficiency experiments

defaults:
  - base

experiment:
  name: pretrain_1h
  description: "Pretraining on 1h LibriSpeech subset"

data:
  dataset: librispeech
  subset: train-clean-100
  max_hours: 1.0  # Use only 1 hour

training:
  max_steps: 10000
  warmup_steps: 500
  batch_size: 8
  gradient_accumulation: 4
  
  # Faster iteration for small data
  save_every_n_steps: 2000
  eval_every_n_steps: 500

model:
  pretraining: true
  finetuning: false
